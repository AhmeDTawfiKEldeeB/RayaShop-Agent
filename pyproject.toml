[project]
name = "rayashop-agent"
version = "0.1.0"
description = "RayaShop Agent - AI-powered shopping assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
