services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rayashop-agent
    ports:
      - "${API__PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - API__HOST=0.0.0.0
      - QDRANT__URL=http://qdrant:6333
      - POSTGRES__HOST=postgres
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rayashop-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rayashop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES__USER:-rayashop_user}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-rayashop_password}
      POSTGRES_DB: ${POSTGRES__DATABASE:-rayashop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER:-rayashop_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
