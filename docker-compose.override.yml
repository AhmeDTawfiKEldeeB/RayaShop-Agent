services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP__DEBUG=true
    volumes:
      - .:/app
      - /app/.venv

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  postgres:
    ports:
      - "5432:5432"
